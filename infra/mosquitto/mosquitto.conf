# Woodstar MQTT broker.
# Logins come from the Dynamic Security plugin: the backend is its admin and creates one login
# per Shelly from admin → Devices. entrypoint.sh creates the file with the backend user.
persistence true
persistence_location /mosquitto/data/

listener 1883
protocol mqtt

allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Retained <deviceId>/online messages are what the backend uses to show device status.
max_queued_messages 1000
log_type error
log_type warning
log_type notice
