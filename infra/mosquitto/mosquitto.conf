# Woodstar MQTT broker.
# Every Shelly and the backend authenticate with username/password from the
# password file. Add a device with infra/mosquitto/add-user.sh.
persistence true
persistence_location /mosquitto/data/

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd

# Retained <deviceId>/online messages are what the backend uses to show device status.
max_queued_messages 1000
log_type error
log_type warning
log_type notice
