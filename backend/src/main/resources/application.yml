spring:
  application:
    name: woodstar-shop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/woodstar}
    username: ${DB_USERNAME:woodstar}
    password: ${DB_PASSWORD:woodstar}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 15000
          writetimeout: 5000
  session:
    timeout: 12h

server:
  port: 8080
  # nginx/Caddy sit in front: trust X-Forwarded-* so the customer IP sent to Maksekeskus is real
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true
        name: WOODSTAR_SESSION

management:
  health:
    mail:
      # SMTP is probed lazily on send; an SMTP outage must not fail the container healthcheck.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

woodstar:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  payments:
    provider: ${PAYMENTS_PROVIDER:fake}
    maksekeskus:
      shop-id: ${MAKSEKESKUS_SHOP_ID:}
      secret-key: ${MAKSEKESKUS_SECRET_KEY:}
      base-url: ${MAKSEKESKUS_BASE_URL:https://api.maksekeskus.ee/v1}
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    host: ${MQTT_HOST:localhost}
    port: ${MQTT_PORT:1883}
    username: ${MQTT_USERNAME:backend}
    password: ${MQTT_PASSWORD:backend}
    tls: ${MQTT_TLS:false}
    client-id-prefix: woodstar-backend
    rpc-timeout-seconds: 5
  mail:
    from: ${MAIL_FROM:noreply@woodstar.ee}
  pickup:
    deadline-hours: ${PICKUP_DEADLINE_HOURS:48}
    reopen-window-minutes: 30
    max-opens: 5
  order:
    reservation-ttl-minutes: 15
  seed-demo-data: false

logging:
  level:
    ee.woodstar: INFO
